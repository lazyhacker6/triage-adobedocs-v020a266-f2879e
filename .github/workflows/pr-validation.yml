---
name: PR Validation
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Produce lint results artifact
        run: |
          echo "true" > has-warnings.txt
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
      - name: Upload lint results
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            has-warnings.txt
            pr-number.txt
